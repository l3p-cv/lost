name: lost

# adds graylog logging to the setup
# comment this out if you don't want to use graylog
include:
  - logging.compose.yaml

volumes:
  app:
  data:
  db:

services:
  traefik:
    command:
      - --api.insecure=true
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --log.level=INFO
      - --log.format=common
      # - --accesslog=true
      # - --accesslog.format=common
    image: traefik:v3.6.13
    ports:
      - 80:80
      - 8090:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always

  frontend:
    image: l3pcv/lost-frontend:${LOST_VERSION}
    restart: always
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.entrypoints=web

  backend:
    image: l3pcv/lost-backend:${LOST_VERSION}
    env_file:
      - .env
    volumes:
      - app:/home/lost/app
      - data:/home/lost/data
    restart: always
    labels:
      - traefik.enable=true
      # Flask → :5000 | FastAPI docs → :8000 (priority=100) | per-namespace routers added in P1.2 (priority=100)
      - traefik.http.routers.backend.rule=PathPrefix(`/api`)||PathPrefix(`/swaggerui`)
      - traefik.http.routers.backend.entrypoints=web
      - traefik.http.routers.backend.service=backend-flask
      - traefik.http.services.backend-flask.loadbalancer.server.port=5000
      - traefik.http.routers.fastapi-docs.rule=PathPrefix(`/docs`)||PathPrefix(`/openapi.json`)||PathPrefix(`/redoc`)
      - traefik.http.routers.fastapi-docs.entrypoints=web
      - traefik.http.routers.fastapi-docs.priority=100
      - traefik.http.routers.fastapi-docs.service=backend-fastapi
      # FastAPI — system namespace (first migrated in P1.2)
      - traefik.http.routers.fastapi-system.rule=PathPrefix(`/api/system`)
      - traefik.http.routers.fastapi-system.entrypoints=web
      - traefik.http.routers.fastapi-system.priority=100
      - traefik.http.routers.fastapi-system.service=backend-fastapi
      # FastAPI — worker namespace (second migrated in P1.2)
      - traefik.http.routers.fastapi-worker.rule=PathPrefix(`/api/worker`)
      - traefik.http.routers.fastapi-worker.entrypoints=web
      - traefik.http.routers.fastapi-worker.priority=100
      - traefik.http.routers.fastapi-worker.service=backend-fastapi
      # Example: fastapi-user.rule=PathPrefix(`/api/user`) + priority=100 + service=backend-fastapi
      - traefik.http.services.backend-fastapi.loadbalancer.server.port=8000
    depends_on:
      db:
        condition: service_started

  db:
    image: mysql:9.3.0
    volumes:
      - db:/var/lib/mysql
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_DATABASE: ${LOST_DB_NAME}
      MYSQL_USER: ${LOST_DB_USER}
      MYSQL_PASSWORD: ${LOST_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${LOST_DB_ROOT_PASSWORD}

  # For easy db access while dev.
  phpmyadmin:
    image: phpmyadmin
    restart: always
    environment:
      MYSQL_USER: ${LOST_DB_USER}
      MYSQL_PASSWORD: ${LOST_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${LOST_DB_ROOT_PASSWORD}
      MYSQL_HOST: "%"
      MYSQL_ROOT_HOST: "%"
    ports:
      - "8081:80"
